<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品71《装好给你看》｜客户现场实景安装效果图</title>
<style>
:root{--bg:#070b13;--card:#111c2b;--line:#1e3049;--txt:#e8f0fa;--dim:#8ba3be;--cyan:#31d6f5;--amber:#ffb02e;--green:#3ee0a6}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;color:var(--txt);
 background:radial-gradient(1100px 600px at 20% -10%,#12243a,var(--bg) 60%) fixed;
 font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;
 border-bottom:1px solid var(--line);background:rgba(7,11,19,.9)}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--amber),#ff7a2f);
 display:grid;place-items:center;color:#1a1200;font-weight:900;font-size:12px}
header b{font-size:15px}
header .sub{color:var(--dim);font-size:11px}
.pill{font-size:10px;padding:3px 8px;border:1px solid var(--line);border-radius:14px;color:var(--dim)}
.pill.a{border-color:rgba(255,176,46,.5);color:var(--amber)}
.pill.g{border-color:rgba(62,224,166,.5);color:var(--green)}
#app{height:calc(100vh - 56px);padding:20px 26px;display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.card{background:linear-gradient(160deg,var(--card),#0b1420);border:1px solid var(--line);
 border-radius:12px;padding:16px 18px;min-height:0}
.left,.right{display:flex;flex-direction:column}
.cap{font-size:10px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.compare{position:relative;flex:1;min-height:240px;border-radius:10px;overflow:hidden;
 border:1px solid var(--line);background:#0a1220}
.layer{position:absolute;inset:0}
.layer svg{width:100%;height:100%;display:block}
.layer.after{clip-path:inset(0 0 0 var(--pos,50%))}
.handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:var(--cyan);
 box-shadow:0 0 14px var(--cyan);z-index:5}
.handle::after{content:"⇄";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 width:32px;height:32px;border-radius:50%;background:var(--cyan);color:#04121a;
 display:grid;place-items:center;font-weight:900;font-size:15px}
.beam{position:absolute;inset:0;z-index:4;pointer-events:none;
 background:linear-gradient(100deg,transparent 38%,rgba(49,214,245,.18) 50%,transparent 62%);
 transform:translateX(-120%)}
.beam.go{animation:sw 1.3s ease-out}
@keyframes sw{to{transform:translateX(120%)}}
.tag{position:absolute;top:10px;padding:3px 9px;border-radius:5px;font-size:10px;
 background:rgba(4,10,18,.8);border:1px solid var(--line);z-index:6}
.tag.l{left:10px}
.tag.r{right:10px;color:var(--amber);border-color:rgba(255,176,46,.4)}
.slider{width:100%;margin:8px 0;accent-color:var(--amber);height:5px}
.steps{display:flex;gap:6px;margin:4px 0 8px}
.step{flex:1;display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);
 border-radius:7px;font-size:11px;color:var(--dim);transition:.3s;min-width:0}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step b{width:16px;height:16px;border-radius:50%;background:#16263a;display:grid;place-items:center;
 font-size:9px;color:var(--dim);flex-shrink:0}
.step.on{border-color:var(--amber);color:var(--txt);background:rgba(255,176,46,.08)}
.step.on b{background:var(--amber);color:#1a1200}
.row{display:flex;gap:8px;margin-top:6px}
.btn{padding:7px 13px;border:1px solid var(--line);border-radius:7px;color:var(--dim);
 font-size:12px;cursor:pointer;background:none;font-family:inherit}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.p{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:800}
.param{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.param:last-child{border:0}
.param span{color:var(--dim)}
.param b{font-variant-numeric:tabular-nums}
.cfg{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.cfg button{flex:1;min-width:64px;padding:7px 4px;border:1px solid var(--line);border-radius:7px;
 background:#16263a;color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit}
.cfg button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,46,.1);font-weight:700}
.rerender{width:100%;padding:9px;margin-bottom:8px;border-color:rgba(255,176,46,.5);color:var(--amber)}
.badge{font-size:11px;color:var(--green);min-height:18px;opacity:0;transition:.3s}
.badge.on{opacity:1}
.brief{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:11px;
 color:var(--dim);line-height:1.7}
.note{margin-top:8px;font-size:10px;color:var(--amber);opacity:.82}
@media(max-width:1000px){#app{grid-template-columns:1fr;overflow:auto;height:auto}body{overflow:auto}}

</style>
</head>
<body>
<header>
 <span class="logo">W</span>
 <div><b>作品 71《装好给你看》</b><div class="sub">客户现场照片 + 技术方案 → 实景安装效果图</div></div>
 <span class="pill">内容创作</span><span class="pill a">场景 71</span><span class="pill g">归属 活动方</span>
</header>
<main id="app"></main>
<script>

/* ===== src/data.js ===== */
/* ============================================================
 * src/data.js  ·  队友 B 负责
 * 结构契约见 CONTRACT.md 第 3 节。字段名不可删改，可新增。
 * 当前是可直接跑的初版，队友 B 在此基础上增强（方案匹配逻辑、更多厂型等）。
 * ========================================================== */
(function () {
  "use strict";
  window.WH = window.WH || {};

  window.WH.DATA = {
    /* 四套配置：数字用 Number，单位由 UI 拼 */
    configs: [
      {
        id: "A", model: "QD 32/5t 双梁",
        span: 22.5, capacity: 32, railHeight: 9.0,
        duty: "A5", agv: 2, renderSec: 90,
        bayType: "single", scene: "机械加工车间"
      },
      {
        id: "B", model: "QD 50/10t 双梁",
        span: 28.5, capacity: 50, railHeight: 12.0,
        duty: "A6", agv: 2, renderSec: 30,
        bayType: "double", scene: "重装总装车间"
      },
      {
        id: "C", model: "LDA 10t 单梁",
        span: 16.5, capacity: 10, railHeight: 7.5,
        duty: "A3", agv: 0, renderSec: 45,
        bayType: "single", scene: "轻载仓储"
      },
      {
        id: "D", model: "QD 100/32t 双梁",
        span: 31.5, capacity: 100, railHeight: 14.0,
        duty: "A7", agv: 4, renderSec: 120,
        bayType: "outdoor", scene: "港口堆场 / 重型装备"
      }
    ],

    /* 三类厂房：用于「识别结构」那一步的说明 */
    bays: {
      single:  { name: "单跨机械加工车间", columnSpan: 6,  railHeight: 9,  roof: "双坡", note: "有行车梁、照明桥架" },
      double:  { name: "双跨重装车间",     columnSpan: 12, railHeight: 12, roof: "网架", note: "中间有柱，需避让" },
      outdoor: { name: "露天堆场",         columnSpan: 0,  railHeight: 0,  roof: "—",   note: "轨道式门机，轨距 31.5 m" }
    },

    /* 四步文案：{span} {railHeight} {duty} {renderSec} 由 UI 替换 */
    steps: [
      { t: "解析现场照片",   d: "识别柱距、轨顶标高、屋面形式、可避让障碍" },
      { t: "识别结构参数",   d: "跨度 {span} m · 轨高 {railHeight} m · 工作级别 {duty}" },
      { t: "匹配已归档方案", d: "方案库 3 套，相似度 87%" },
      { t: "渲染安装效果图", d: "{renderSec} s 生成 · 参数可改可重出" }
    ],

    /* 「客户改需求」桥段 */
    rerender: {
      label: "客户改需求：跨度 28.5 m、起重量 50 t",
      target: "B",
      done: "已按新需求重出图 · 30 s"
    },

    /* 一页说明 */
    brief: {
      problem:  "客户最想看的不是参数表，是「我的厂房装上它长什么样」；外部渲染排期 2–3 天，投标窗口等不起。",
      solution: "现场实景照片 + 客户技术方案 → 实景安装效果图，参数可改、当场重出。",
      value:    "售前沟通从「等图」变「当面改图」；周期账为本作品推算，非主办方原文。",
      landing:  "不碰内网，纯离线演示；出图引擎可后续接已报备的工具。"
    },

    /* 顶部标识（不要写死真实客户信息） */
    meta: {
      track: "内容创作",
      scene: "场景 71",
      owner: "归属 活动方",
      disclaimer: "全部型号、跨度、起重量、用时均为演示模拟值，不是真实设备参数，不可用于工程判断。"
    }
  };

  /* —— 可选增强（队友 B 可扩展）——
   * 1. 方案匹配：按 bayType/span 算相似度，替换 steps[2].d 里的「87%」
   * 2. 更多厂型：在 bays 里加键，同时在 configs 里引用
   * 3. 客户画像：给每套配置加 industry 字段，UI 可用来讲故事
   */
})();


/* ===== src/render.js ===== */
/* ============================================================
 * src/render.js  ·  Codex 负责（全项目最难的一块）
 *
 * 契约：WH.renderScene(params) -> 完整 SVG 字符串
 *   params = { span, capacity, railHeight, duty, agv, bayType, mode:'before'|'after' }
 * 详见 CONTRACT.md 第 4 节。
 *
 * ⚠️ 当前是「降级占位实现」，只为让联调能跑起来。
 *    Codex 请整段替换为真正的等轴测/轴测渲染：
 *    - 跨度变化 → 厂房与门机比例跟着变（不是只改数字）
 *    - 起重量变化 → 主梁/小车/吊钩视觉权重变化
 *    - 简单光影：地面阴影 + 受光面
 *    - before：空厂房（灰暗）；after：装好设备（暖光 + 高亮标注）
 *    - 单次 ≤16ms，节点 ≤300，纯函数，无外部资源
 * ========================================================== */
(function () {
  "use strict";
  window.WH = window.WH || {};

  window.WH.renderScene = function (params) {
    var p = params || {};
    var span = Number(p.span) || 22.5;
    var cap = Number(p.capacity) || 32;
    var rail = Number(p.railHeight) || 9;
    var agv = Number(p.agv) || 0;
    var after = p.mode !== "before";

    /* —— 以下为占位几何：只为验证契约，Codex 请替换 —— */
    var W = 800, H = 400;
    var k = Math.max(0.72, Math.min(1.24, span / 22.5));      // 跨度比例
    var beamW = 520 * k;
    var beamY = 128 - (rail - 9) * 6;
    var x0 = (W - beamW) / 2;
    var col = after ? "#ffb02e" : "#3a5573";
    var bg = after ? "#0d1a2a" : "#0a1220";
    var floor = after ? "#122236" : "#101a28";

    var s = '<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">';
    s += '<rect width="800" height="400" fill="' + bg + '"/>';
    s += '<rect y="300" width="800" height="100" fill="' + floor + '"/>';
    /* 主梁 */
    s += '<rect x="' + x0 + '" y="' + beamY + '" width="' + beamW + '" height="14" rx="2" fill="' + col + '"/>';
    /* 支腿 */
    s += '<path d="M' + (x0 + 22) + ' ' + beamY + ' V300 M' + (x0 + beamW - 22) + ' ' + beamY + ' V300" stroke="' + col + '" stroke-width="9" fill="none"/>';
    if (after) {
      /* 小车 + 吊钩 + 重物（占位方块） */
      var cx = W / 2;
      s += '<rect x="' + (cx - 34) + '" y="' + (beamY - 12) + '" width="68" height="24" rx="3" fill="#ffd27a"/>';
      s += '<path d="M' + cx + ' ' + (beamY + 12) + ' V' + (beamY + 90) + '" stroke="#ffd27a" stroke-width="2" fill="none"/>';
      s += '<rect x="' + (cx - 26) + '" y="' + (beamY + 90) + '" width="52" height="26" rx="3" fill="#1b3b56" stroke="#35d6f5"/>';
      /* AGV 路径 */
      if (agv > 0) {
        s += '<path d="M' + (x0 + 60) + ' 332 H' + (x0 + beamW - 60) + '" stroke="#31d6f5" stroke-width="2" stroke-dasharray="8 6" opacity=".8"/>';
        s += '<circle cx="' + (x0 + 60) + '" cy="332" r="4" fill="#35e0a1"/><circle cx="' + (x0 + beamW - 60) + '" cy="332" r="4" fill="#35e0a1"/>';
      }
    }
    s += '<text x="24" y="34" fill="' + (after ? "#ffb02e" : "#5c7591") + '" font-size="12">' +
         (after ? "AI 生成 · 实景安装效果图" : "客户现场实景照片 · 空厂房（示意）") + "</text>";
    s += '<text x="24" y="386" fill="#5f7b98" font-size="10">跨度 ' + span + " m · 起重量 " + cap +
         " t · 轨高 " + rail + " m · AGV " + agv + " 台（示意，非真实参数）</text>";
    s += "</svg>";
    return s;
  };
})();


/* ===== src/ui.js ===== */
/* ============================================================
 * src/ui.js  ·  队友 A 负责
 *
 * 职责：对比滑块、四步进度、参数卡、方案切换、改需求桥段、
 *       播放 / 跳过 / 全屏、一页说明。
 * 契约：WH.initUI() 自动调用一次；只读 WH.DATA，只调 WH.renderScene。
 * 详见 CONTRACT.md 第 5 节。
 *
 * ⚠️ 当前是「降级占位实现」，能跑但粗糙，队友 A 请按 BRIEF 第 3 节重做。
 * ========================================================== */
(function () {
  "use strict";
  window.WH = window.WH || {};
  var D = window.WH.DATA;
  var cur = 0, T = [];

  function q(s) { return document.querySelector(s); }
  function at(ms, fn) { T.push(setTimeout(fn, ms)); }
  function clr() { T.forEach(clearTimeout); T = []; }
  function cfg() { return D.configs[cur]; }
  function fmt(c) {
    return { span: c.span.toFixed(1), railHeight: c.railHeight.toFixed(1), duty: c.duty, renderSec: c.renderSec };
  }
  function stepText(tpl, c) {
    var v = fmt(c);
    return String(tpl).replace(/\{(\w+)\}/g, function (_, k) { return v[k] !== undefined ? v[k] : ""; });
  }

  /* ---------- 结构 ---------- */
  function build() {
    var app = q("#app");
    app.innerHTML =
      '<div class="card left">' +
        '<div class="cap">客户现场照片 → AI 安装效果图（示意）</div>' +
        '<div class="compare" id="cmp" style="--pos:50%"></div>' +
        '<input class="slider" id="pos" type="range" min="0" max="100" value="50">' +
        '<div class="steps" id="steps"></div>' +
        '<div class="row">' +
          '<button class="btn p" id="play">▶ 播放演示</button>' +
          '<button class="btn" id="skip">跳过动画</button>' +
          '<button class="btn" id="full">全屏</button>' +
        '</div>' +
      '</div>' +
      '<div class="card right">' +
        '<div class="cap">方案参数</div>' +
        '<div id="params"></div>' +
        '<div class="cfg" id="cfg"></div>' +
        '<button class="btn rerender" id="btnRerender"></button>' +
        '<div class="badge" id="badge"></div>' +
        '<div class="brief" id="brief"></div>' +
      '</div>';

    /* 四步 */
    q("#steps").innerHTML = D.steps.map(function (s, i) {
      return '<div class="step" data-i="' + i + '"><b>' + (i + 1) + "</b><span>" + s.t + "</span></div>";
    }).join("");

    /* 方案按钮 */
    q("#cfg").innerHTML = D.configs.map(function (c, i) {
      return '<button data-i="' + i + '">' + c.id + " · " + c.capacity + "t</button>";
    }).join("");

    q("#btnRerender").textContent = D.rerender.label;
    q("#brief").innerHTML = "<b>问题</b>　" + D.brief.problem + "<br><b>价值</b>　" + D.brief.value +
      '<div class="note">' + D.meta.disclaimer + "</div>";

    bind();
  }

  /* ---------- 渲染 ---------- */
  function draw(animateSteps) {
    var c = cfg();
    var before = WH.renderScene({ span: c.span, capacity: c.capacity, railHeight: c.railHeight, duty: c.duty, agv: c.agv, bayType: c.bayType, mode: "before" });
    var after = WH.renderScene({ span: c.span, capacity: c.capacity, railHeight: c.railHeight, duty: c.duty, agv: c.agv, bayType: c.bayType, mode: "after" });
    q("#cmp").innerHTML =
      '<div class="layer before">' + before + "</div>" +
      '<div class="layer after">' + after + "</div>" +
      '<div class="beam" id="beam"></div>' +
      '<span class="tag l">BEFORE · 现场</span><span class="tag r">AFTER · AI 效果图</span>' +
      '<div class="handle"></div>';

    /* 参数卡 7 值 */
    var rows = [
      ["设备型号", c.model], ["厂房跨度", c.span.toFixed(1) + " m"], ["起重量", c.capacity + " t"],
      ["轨顶标高", c.railHeight.toFixed(1) + " m"], ["工作级别", c.duty],
      ["搬运配置", c.agv ? "AGV × " + c.agv : "无 AGV"], ["出图用时", c.renderSec + " s"]
    ];
    q("#params").innerHTML = rows.map(function (r) {
      return '<div class="param"><span>' + r[0] + "</span><b>" + r[1] + "</b></div>";
    }).join("");

    /* 四步文案（替换占位符） */
    D.steps.forEach(function (s, i) {
      var el = document.querySelector('.step[data-i="' + i + '"] span');
      if (el) el.textContent = stepText(s.t, c);
      var d = document.querySelector('.step[data-i="' + i + '"]');
      if (d) d.title = stepText(s.d, c);
    });

    $("#cfg button").forEach(function (b, i) { b.classList.toggle("on", i === cur); });
    q("#badge").classList.remove("on");

    if (animateSteps) playSteps();
    else setSteps(true);
  }
  function $(s) { return [].slice.call(document.querySelectorAll(s)); }

  function setSteps(all) {
    $(".step").forEach(function (s) { s.classList.toggle("on", !!all); });
  }
  function playSteps() {
    clr(); setSteps(false);
    var i = 0;
    (function next() {
      if (i >= 4) return;
      at(420, function () {
        $(".step")[i].classList.add("on");
        i++;
        if (i === 4) at(220, sweep);
        next();
      });
    })();
  }
  function sweep() {
    var b = q("#beam"); if (!b) return;
    b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
  }

  /* ---------- 播放 / 跳过 ---------- */
  function play() {
    clr(); draw(false); setSteps(false);
    q("#cmp").style.setProperty("--pos", "50%"); q("#pos").value = 50;
    at(260, playSteps);
    at(2200, function () { slide(50, 18); });
    at(3400, function () { slide(18, 82); });
    at(4400, function () { slide(82, 50); });
  }
  function slide(from, to) {
    var st = performance.now(), dur = 900;
    (function step(now) {
      var p = Math.min(1, (now - st) / dur), v = from + (to - from) * (1 - Math.pow(1 - p, 3));
      q("#cmp").style.setProperty("--pos", v + "%"); q("#pos").value = Math.round(v);
      if (p < 1) requestAnimationFrame(step);
    })(st);
  }
  function skip() {
    clr(); draw(false); setSteps(true); sweep();
    q("#cmp").style.setProperty("--pos", "12%"); q("#pos").value = 12;
    q("#badge").textContent = "已显示终态"; q("#badge").classList.add("on");
  }

  /* ---------- 改需求 ---------- */
  function rerender() {
    clr();
    var t = D.configs.filter(function (c) { return c.id === D.rerender.target; })[0];
    var idx = D.configs.indexOf(t);
    if (idx < 0) return;
    q("#badge").textContent = "正在按新需求重出图…"; q("#badge").classList.add("on");
    at(260, function () { cur = idx; draw(false); setSteps(false); });
    at(700, function () { setSteps(true); sweep(); });
    at(1100, function () {
      q("#badge").textContent = D.rerender.done;
      q("#cmp").style.setProperty("--pos", "12%"); q("#pos").value = 12;
    });
  }

  /* ---------- 事件 ---------- */
  function bind() {
    q("#play").addEventListener("click", play);
    q("#skip").addEventListener("click", skip);
    q("#full").addEventListener("click", function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    });
    q("#pos").addEventListener("input", function (e) { clr(); q("#cmp").style.setProperty("--pos", e.target.value + "%"); });
    q("#cfg").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      cur = Number(b.dataset.i); clr(); draw(false); sweep();
    });
    q("#btnRerender").addEventListener("click", rerender);
    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT") return;
      if (e.key === " ") { e.preventDefault(); play(); }
      else if (e.key === "f" || e.key === "F") q("#full").click();
      else if (e.key === "Escape") location.reload();
    });
  }

  var booted = false, tries = 0;
  window.WH.initUI = function () {
    if (booted) return;
    if (!document.getElementById("app")) { if (++tries < 200) setTimeout(window.WH.initUI, 30); return; }
    booted = true;
    build(); draw(false);
  };

  /* 兼容两种加载场景：正常 file:// 打开，以及 CDP setDocumentContent 注入
     （后者 readyState 可能停在 loading 且不再触发 DOMContentLoaded） */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { window.WH.initUI(); });
    setTimeout(function () { window.WH.initUI(); }, 0);
  } else {
    window.WH.initUI();
  }
})();

</script>
</body>
</html>
