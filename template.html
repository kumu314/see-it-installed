<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品71《装好给你看》｜客户现场实景安装效果图</title>
<style>
:root{--bg:#070b13;--card:#111c2b;--line:#1e3049;--txt:#e8f0fa;--dim:#8ba3be;--cyan:#31d6f5;--amber:#ffb02e;--green:#3ee0a6}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;color:var(--txt);
 background:radial-gradient(1100px 600px at 20% -10%,#12243a,var(--bg) 60%) fixed;
 font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;
 border-bottom:1px solid var(--line);background:rgba(7,11,19,.9)}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--amber),#ff7a2f);
 display:grid;place-items:center;color:#1a1200;font-weight:900;font-size:12px}
header b{font-size:15px}
header .sub{color:var(--dim);font-size:11px}
.pill{font-size:10px;padding:3px 8px;border:1px solid var(--line);border-radius:14px;color:var(--dim)}
.pill.a{border-color:rgba(255,176,46,.5);color:var(--amber)}
.pill.g{border-color:rgba(62,224,166,.5);color:var(--green)}
#app{height:calc(100vh - 56px);padding:20px 26px;display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.card{background:linear-gradient(160deg,var(--card),#0b1420);border:1px solid var(--line);
 border-radius:12px;padding:16px 18px;min-height:0}
.left,.right{display:flex;flex-direction:column}
.cap{font-size:10px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.compare{position:relative;flex:1;min-height:240px;border-radius:10px;overflow:hidden;
 border:1px solid var(--line);background:#0a1220}
.layer{position:absolute;inset:0}
.layer svg{width:100%;height:100%;display:block}
.layer.after{clip-path:inset(0 0 0 var(--pos,50%))}
.handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:var(--cyan);
 box-shadow:0 0 14px var(--cyan);z-index:5}
.handle::after{content:"⇄";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 width:32px;height:32px;border-radius:50%;background:var(--cyan);color:#04121a;
 display:grid;place-items:center;font-weight:900;font-size:15px}
.beam{position:absolute;inset:0;z-index:4;pointer-events:none;
 background:linear-gradient(100deg,transparent 38%,rgba(49,214,245,.18) 50%,transparent 62%);
 transform:translateX(-120%)}
.beam.go{animation:sw 1.3s ease-out}
@keyframes sw{to{transform:translateX(120%)}}
.tag{position:absolute;top:10px;padding:3px 9px;border-radius:5px;font-size:10px;
 background:rgba(4,10,18,.8);border:1px solid var(--line);z-index:6}
.tag.l{left:10px}
.tag.r{right:10px;color:var(--amber);border-color:rgba(255,176,46,.4)}
.slider{width:100%;margin:8px 0;accent-color:var(--amber);height:5px}
.steps{display:flex;gap:6px;margin:4px 0 8px}
.step{flex:1;display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);
 border-radius:7px;font-size:11px;color:var(--dim);transition:.3s;min-width:0}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step b{width:16px;height:16px;border-radius:50%;background:#16263a;display:grid;place-items:center;
 font-size:9px;color:var(--dim);flex-shrink:0}
.step.on{border-color:var(--amber);color:var(--txt);background:rgba(255,176,46,.08)}
.step.on b{background:var(--amber);color:#1a1200}
.row{display:flex;gap:8px;margin-top:6px}
.btn{padding:7px 13px;border:1px solid var(--line);border-radius:7px;color:var(--dim);
 font-size:12px;cursor:pointer;background:none;font-family:inherit}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.p{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:800}
.param{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.param:last-child{border:0}
.param span{color:var(--dim)}
.param b{font-variant-numeric:tabular-nums}
.cfg{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.cfg button{flex:1;min-width:64px;padding:7px 4px;border:1px solid var(--line);border-radius:7px;
 background:#16263a;color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit}
.cfg button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,46,.1);font-weight:700}
.rerender{width:100%;padding:9px;margin-bottom:8px;border-color:rgba(255,176,46,.5);color:var(--amber)}
.badge{font-size:11px;color:var(--green);min-height:18px;opacity:0;transition:.3s}
.badge.on{opacity:1}
.brief{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:11px;
 color:var(--dim);line-height:1.7}
.note{margin-top:8px;font-size:10px;color:var(--amber);opacity:.82}
@media(max-width:1000px){#app{grid-template-columns:1fr;overflow:auto;height:auto}body{overflow:auto}}
<!--INJECT_CSS-->
</style>
</head>
<body>
<header>
 <span class="logo">W</span>
 <div><b>作品 71《装好给你看》</b><div class="sub">客户现场照片 + 技术方案 → 实景安装效果图</div></div>
 <span class="pill">内容创作</span><span class="pill a">场景 71</span><span class="pill g">归属 活动方</span>
</header>
<main id="app"></main>
<!--INJECT_JS-->
</body>
</html>
